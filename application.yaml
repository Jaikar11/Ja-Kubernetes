apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ja-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jaikar11/Ja-Kubernetes.git
    targetRevision: develop
    path: Nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ja-nginx
  syncPolicy:
    automated:
        selfHeal: true
        prune: true
    syncOptions:
    - CreateNamespace=true

